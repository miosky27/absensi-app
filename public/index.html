<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Absensi Karyawan</title>
<link rel="manifest" href="/manifest.json" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f6f8; color: #1a1a1a; min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #333; }
  input[type=text], input[type=tel] {
    width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; margin-bottom: 14px;
  }
  .btn {
    width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-bottom: 10px;
  }
  .btn-primary { background: #1a73e8; color: #fff; }
  .btn-secondary { background: #e8eaed; color: #1a1a1a; }
  .btn:disabled { opacity: 0.5; }
  .row-2 { display: flex; gap: 10px; }
  .row-2 .btn { flex: 1; }
  .preview { width: 100%; border-radius: 10px; margin-bottom: 14px; display: none; }
  .status { padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 14px; display: none; }
  .status.ok { background: #e6f4ea; color: #137333; display: block; }
  .status.warn { background: #fef7e0; color: #b06000; display: block; }
  .status.err { background: #fce8e6; color: #c5221f; display: block; }
  .muted { color: #888; font-size: 12px; }
  .name-tag { font-weight: 700; color: #1a73e8; }
  a.admin-link { display: block; text-align: center; margin-top: 10px; font-size: 13px; color: #888; }
  .shift-option {
    width: 100%; text-align: left; padding: 14px; border: 1.5px solid #ddd; border-radius: 10px;
    background: #fff; margin-bottom: 10px; cursor: pointer; font-size: 15px;
  }
  .shift-option:active { background: #e8f0fe; border-color: #1a73e8; }
  .shift-option .shift-time { display:block; font-size: 13px; color: #666; margin-top: 2px; }
  .hist-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #eee; font-size:14px; }
  .hist-row:last-child { border-bottom: none; }
  .hist-left { display:flex; flex-direction:column; }
  .hist-date { font-weight:600; font-size:13px; color:#333; }
  .hist-type { font-size:12px; color:#666; }
  .hist-badge { padding:3px 9px; border-radius:10px; font-size:11px; font-weight:700; }
  .hist-badge.ok { background:#e6f4ea; color:#137333; }
  .hist-badge.bad { background:#fce8e6; color:#c5221f; }

  /* ---- Profil & dashboard riwayat ---- */
  .profile-head { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .profile-avatar { width:54px; height:54px; border-radius:50%; object-fit:cover; background:#e8eaed; border:1px solid #eee; flex-shrink:0; }
  .profile-info .pname { font-weight:700; font-size:16px; }
  .profile-info .pmeta { font-size:12px; color:#666; margin-top:2px; }
  .stat-row { display:flex; gap:10px; margin-bottom:16px; }
  .stat-box { flex:1; background:#f4f6f8; border-radius:12px; padding:12px 8px; text-align:center; }
  .stat-box .snum { font-size:18px; font-weight:800; color:#1a1a1a; }
  .stat-box .slbl { font-size:11px; color:#666; margin-top:2px; }
  .today-card { background:linear-gradient(135deg,#1a73e8,#1557b0); border-radius:14px; padding:14px; margin-bottom:16px; }
  .today-card .tc-label { color:#cfe0fb; font-size:12px; margin-bottom:10px; }
  .today-row { display:flex; gap:10px; }
  .today-box { flex:1; border-radius:10px; padding:10px 12px; }
  .today-box.in { background:rgba(255,255,255,0.18); }
  .today-box.out { background:rgba(255,255,255,0.18); }
  .today-box .tb-lbl { color:#e8f0fe; font-size:11px; font-weight:600; }
  .today-box .tb-time { color:#fff; font-size:18px; font-weight:800; margin-top:2px; }
  .day-card { border:1px solid #eee; border-radius:12px; padding:12px; margin-bottom:10px; }
  .day-card .dc-date { font-weight:700; font-size:13px; margin-bottom:8px; }
  .day-card .dc-row { display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:4px 0; }
  .day-card .dc-row .dc-lbl { color:#666; }
  .day-card .dc-row .dc-time { font-weight:700; }
  .day-card .dc-meta { font-size:11px; color:#888; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📍 Absensi Karyawan</h1>
  <div class="sub">Absen dengan foto, lokasi, dan waktu otomatis</div>

  <div class="card" id="phoneCard">
    <label>Nomor Telepon</label>
    <input type="tel" id="phoneInput" placeholder="Contoh: 081234567890" inputmode="numeric" />
    <button class="btn btn-primary" id="checkPhoneBtn">Lanjutkan</button>
    <div class="status" id="phoneStatus"></div>
  </div>

  <div class="card" id="actionCard" style="display:none">
    <div class="sub">Halo, <span class="name-tag" id="empName"></span></div>

    <div class="row-2" style="margin-bottom:14px">
      <button class="btn btn-primary" id="btnMasuk">Absen Masuk</button>
      <button class="btn btn-secondary" id="btnKeluar">Absen Keluar</button>
    </div>

    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" />
    <img id="preview" class="preview" />

    <div class="status" id="actionStatus"></div>
    <button class="btn btn-secondary" id="btnRiwayat">Lihat Riwayat Absensi Saya</button>
    <button class="btn btn-secondary" id="gantiNomor">Ganti Nomor</button>
  </div>

  <div class="card" id="shiftCard" style="display:none">
    <div class="sub">Lokasi terdeteksi: <span class="name-tag" id="shiftLocationName"></span></div>
    <label>Pilih Shift Anda Hari Ini</label>
    <div id="shiftOptions"></div>
    <button class="btn btn-secondary" id="batalShift">Batal</button>
  </div>

  <div class="card" id="historyCard" style="display:none">
    <div class="profile-head">
      <img class="profile-avatar" id="historyAvatar" src="" onerror="this.style.visibility='hidden'" />
      <div class="profile-info">
        <div class="pname" id="historyEmpName"></div>
        <div class="pmeta" id="historyEmpMeta"></div>
      </div>
    </div>

    <input type="month" id="historyMonthInput" style="width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin-bottom:14px" />

    <div class="stat-row" id="statRow" style="display:none">
      <div class="stat-box"><div class="snum" id="statHadir">0</div><div class="slbl">Hari Hadir</div></div>
      <div class="stat-box"><div class="snum" id="statTerlambat">0</div><div class="slbl">Terlambat</div></div>
      <div class="stat-box"><div class="snum" id="statLembur">0</div><div class="slbl">Lembur (jam)</div></div>
    </div>

    <div class="today-card" id="todayCard" style="display:none">
      <div class="tc-label" id="todayDateLabel"></div>
      <div class="today-row">
        <div class="today-box in"><div class="tb-lbl">Check In</div><div class="tb-time" id="todayMasuk">—</div></div>
        <div class="today-box out"><div class="tb-lbl">Check Out</div><div class="tb-time" id="todayKeluar">—</div></div>
      </div>
    </div>

    <div class="muted" style="margin-bottom:6px">Riwayat Harian</div>
    <div id="historyList"></div>
    <div class="hint" id="historyEmpty"></div>
    <button class="btn btn-secondary" id="tutupRiwayat" style="margin-top:10px">Tutup</button>
  </div>

  <div class="muted" style="text-align:center">
    Pastikan izin <b>Lokasi</b> dan <b>Kamera</b> diaktifkan di browser Anda.
  </div>
  <a class="admin-link" href="/admin.html">Admin</a>
</div>

<script>
const phoneCard = document.getElementById('phoneCard');
const actionCard = document.getElementById('actionCard');
const shiftCard = document.getElementById('shiftCard');
const phoneInput = document.getElementById('phoneInput');
const phoneStatus = document.getElementById('phoneStatus');
const empName = document.getElementById('empName');
const photoInput = document.getElementById('photoInput');
const preview = document.getElementById('preview');
const actionStatus = document.getElementById('actionStatus');
const shiftLocationName = document.getElementById('shiftLocationName');
const shiftOptions = document.getElementById('shiftOptions');

let currentPhone = '';
let currentType = null;
let currentShift = null;
let currentLat = null;
let currentLng = null;

function showStatus(el, msg, cls) {
  el.textContent = msg;
  el.className = 'status ' + cls;
}

let currentProfile = null;

document.getElementById('checkPhoneBtn').addEventListener('click', async () => {
  const phone = phoneInput.value.trim();
  if (!phone) return showStatus(phoneStatus, 'Nomor telepon wajib diisi', 'err');
  showStatus(phoneStatus, 'Memeriksa...', 'warn');
  try {
    const res = await fetch('/api/check-phone', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone }),
    });
    const data = await res.json();
    if (!res.ok) return showStatus(phoneStatus, data.error || 'Nomor tidak ditemukan', 'err');
    currentPhone = phone;
    currentProfile = data;
    empName.textContent = data.name;
    phoneCard.style.display = 'none';
    actionCard.style.display = 'block';
    phoneStatus.style.display = 'none';
  } catch (e) {
    showStatus(phoneStatus, 'Gagal menghubungi server: ' + e.message, 'err');
  }
});

document.getElementById('gantiNomor').addEventListener('click', () => {
  actionCard.style.display = 'none';
  phoneCard.style.display = 'block';
  preview.style.display = 'none';
  actionStatus.style.display = 'none';
});

// ---- Riwayat Absensi Saya ----
const historyCard = document.getElementById('historyCard');
const historyMonthInput = document.getElementById('historyMonthInput');
const historyList = document.getElementById('historyList');
const historyEmpty = document.getElementById('historyEmpty');

document.getElementById('btnRiwayat').addEventListener('click', () => {
  historyMonthInput.value = new Date().toISOString().slice(0, 7);
  actionCard.style.display = 'none';
  historyCard.style.display = 'block';
  loadHistory();
});

document.getElementById('tutupRiwayat').addEventListener('click', () => {
  historyCard.style.display = 'none';
  actionCard.style.display = 'block';
});

historyMonthInput.addEventListener('change', loadHistory);

function fmtTerlambat(jam, menit) {
  if (!jam && !menit) return '0';
  return (jam > 0 ? jam + 'j ' : '') + menit + 'm';
}

async function loadHistory() {
  historyList.innerHTML = '';
  historyEmpty.textContent = 'Memuat...';
  document.getElementById('statRow').style.display = 'none';
  document.getElementById('todayCard').style.display = 'none';
  try {
    const month = historyMonthInput.value;
    const res = await fetch(`/api/my-records?phone=${encodeURIComponent(currentPhone)}&month=${month}`);
    const data = await res.json();
    if (!res.ok) { historyEmpty.textContent = data.error || 'Gagal memuat riwayat'; return; }

    // Profil
    document.getElementById('historyEmpName').textContent = data.name;
    document.getElementById('historyEmpMeta').textContent = [data.position, data.idNumber ? 'ID: ' + data.idNumber : ''].filter(Boolean).join(' • ');
    const avatarEl = document.getElementById('historyAvatar');
    if (data.photoUrl) { avatarEl.src = data.photoUrl; avatarEl.style.visibility = 'visible'; }
    else { avatarEl.style.visibility = 'hidden'; }

    // Ringkasan bulan ini
    const statRow = document.getElementById('statRow');
    statRow.style.display = 'flex';
    document.getElementById('statHadir').textContent = data.summary.hariHadir;
    document.getElementById('statTerlambat').textContent = fmtTerlambat(data.summary.terlambatJam, data.summary.terlambatMenit);
    document.getElementById('statLembur').textContent = data.totalLemburJam;

    // Hari ini (hanya tampil kalau bulan yang dipilih adalah bulan berjalan)
    const isCurrentMonth = month === new Date().toISOString().slice(0, 7);
    if (isCurrentMonth) {
      const todayCard = document.getElementById('todayCard');
      todayCard.style.display = 'block';
      document.getElementById('todayDateLabel').textContent = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      document.getElementById('todayMasuk').textContent = data.today.masuk ? data.today.masuk + ' WIB' : '—';
      document.getElementById('todayKeluar').textContent = data.today.keluar ? data.today.keluar + ' WIB' : '—';
    }

    if (!data.records || data.records.length === 0) {
      historyEmpty.textContent = 'Belum ada riwayat absen di bulan ini.';
      return;
    }
    historyEmpty.textContent = '';

    // Kelompokkan per tanggal supaya Check In & Check Out tampil dalam satu kartu.
    const byDate = {};
    const order = [];
    data.records.forEach((r) => {
      if (!byDate[r.dateKey]) { byDate[r.dateKey] = { masuk: null, keluar: null }; order.push(r.dateKey); }
      byDate[r.dateKey][r.type] = r;
    });

    order.forEach((dateKey) => {
      const d = byDate[dateKey];
      const ref = d.masuk || d.keluar;
      const anyInvalid = (d.masuk && !d.masuk.withinRadius) || (d.keluar && !d.keluar.withinRadius);
      const card = document.createElement('div');
      card.className = 'day-card';
      const dateLabel = new Date(dateKey + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      card.innerHTML = `
        <div class="dc-date">${dateLabel}</div>
        <div class="dc-row"><span class="dc-lbl">Check In</span><span class="dc-time">${d.masuk ? d.masuk.timeHHMM + ' WIB' : '—'}</span></div>
        <div class="dc-row"><span class="dc-lbl">Check Out</span><span class="dc-time">${d.keluar ? d.keluar.timeHHMM + ' WIB' : '—'}</span></div>
        <div class="dc-meta">${ref.shift ? ref.shift + ' • ' : ''}${ref.nearestLocation || ''}${anyInvalid ? ' • <span style="color:#c5221f">di luar radius</span>' : ''}</div>
      `;
      historyList.appendChild(card);
    });
  } catch (e) {
    historyEmpty.textContent = 'Gagal memuat riwayat: ' + e.message;
  }
}

function getLocation() {
  if (!navigator.geolocation) {
    return Promise.reject(new Error('Perangkat tidak mendukung GPS.'));
  }
  // Coba dulu dengan GPS akurasi tinggi (lebih presisi, tapi bisa lambat di dalam ruangan).
  const tryHighAccuracy = new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve(pos.coords),
      (err) => reject(err),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
    );
  });

  return tryHighAccuracy.catch((err) => {
    // Kalau gagal karena timeout atau sinyal GPS lemah, coba lagi dengan akurasi lebih
    // rendah (WiFi/jaringan) yang biasanya lebih cepat didapat di dalam toko/ruangan.
    if (err && err.code === 3 /* TIMEOUT */) {
      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve(pos.coords),
          (err2) => reject(new Error('Gagal mengambil lokasi: ' + err2.message + '. Pastikan izin lokasi aktif dan coba berdiri lebih dekat ke pintu/jendela.')),
          { enableHighAccuracy: false, timeout: 20000, maximumAge: 5000 }
        );
      });
    }
    throw new Error('Gagal mengambil lokasi: ' + err.message + '. Pastikan izin lokasi aktif.');
  });
}

async function startAbsen(type) {
  currentType = type;
  currentShift = null;

  if (type === 'keluar') {
    // Absen keluar tidak perlu pilih shift, langsung ambil foto.
    photoInput.value = '';
    photoInput.click();
    return;
  }

  // Absen masuk: ambil lokasi dulu untuk tahu shift apa saja yang tersedia di lokasi ini.
  showStatus(actionStatus, 'Mengambil lokasi GPS...', 'warn');
  try {
    const coords = await getLocation();
    currentLat = coords.latitude;
    currentLng = coords.longitude;
    const res = await fetch('/api/nearest-location', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat: currentLat, lng: currentLng }),
    });
    const data = await res.json();
    if (!res.ok) return showStatus(actionStatus, data.error || 'Gagal memuat lokasi', 'err');
    if (!data.shifts || data.shifts.length === 0) {
      return showStatus(actionStatus, `Lokasi terdekat (${data.name}) belum punya shift yang diatur. Hubungi admin.`, 'err');
    }
    showShiftPicker(data.name, data.shifts);
    actionStatus.style.display = 'none';
  } catch (e) {
    showStatus(actionStatus, e.message, 'err');
  }
}
document.getElementById('btnMasuk').addEventListener('click', () => startAbsen('masuk'));
document.getElementById('btnKeluar').addEventListener('click', () => startAbsen('keluar'));

function showShiftPicker(locationName, shifts) {
  shiftLocationName.textContent = locationName;
  shiftOptions.innerHTML = '';
  shifts.forEach((s) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'shift-option';
    btn.innerHTML = `${s.name}<span class="shift-time">${s.startTime} – ${s.endTime}</span>`;
    btn.addEventListener('click', () => {
      currentShift = s.name;
      shiftCard.style.display = 'none';
      actionCard.style.display = 'block';
      photoInput.value = '';
      photoInput.click();
    });
    shiftOptions.appendChild(btn);
  });
  actionCard.style.display = 'none';
  shiftCard.style.display = 'block';
}

document.getElementById('batalShift').addEventListener('click', () => {
  shiftCard.style.display = 'none';
  actionCard.style.display = 'block';
});

photoInput.addEventListener('change', async () => {
  const file = photoInput.files[0];
  if (!file) return;
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';

  try {
    // Untuk absen masuk, lokasi sudah diambil sebelumnya (saat pilih shift).
    // Untuk absen keluar, ambil lokasi sekarang.
    if (currentType === 'keluar') {
      showStatus(actionStatus, 'Mengambil lokasi GPS...', 'warn');
      const coords = await getLocation();
      currentLat = coords.latitude;
      currentLng = coords.longitude;
    }

    showStatus(actionStatus, 'Mengirim data absen...', 'warn');
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const res = await fetch('/api/checkin', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: currentPhone,
            type: currentType,
            lat: currentLat,
            lng: currentLng,
            shift: currentShift,
            photoBase64: reader.result,
            deviceTime: new Date().toISOString(),
          }),
        });
        const data = await res.json();
        if (!res.ok) return showStatus(actionStatus, data.error || 'Gagal mengirim absen', 'err');
        showStatus(actionStatus, data.message, data.withinRadius ? 'ok' : 'warn');
      } catch (e) {
        showStatus(actionStatus, 'Gagal mengirim: ' + e.message, 'err');
      }
    };
    reader.readAsDataURL(file);
  } catch (e) {
    showStatus(actionStatus, e.message, 'err');
  }
});
</script>
</body>
</html>
