<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Absensi Erly's Cake & Bakery</title>
<link rel="manifest" href="/manifest.json" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #faf5ec; color: #2a1a26; min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 18px; margin: 0 0 2px; color:#4a1843; }
  .brand-head { display:flex; align-items:center; gap:12px; margin-bottom: 20px; }
  .brand-head .sub { margin-bottom: 0; }
  .brand-logo { height: 52px; width: auto; flex-shrink: 0; }
  .sub { color: #666; font-size: 14px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #333; }
  input[type=text], input[type=tel] {
    width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; margin-bottom: 14px;
  }
  .btn {
    width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-bottom: 10px;
  }
  .btn-primary { background: #702464; color: #fff; }
  .btn-secondary { background: #e8eaed; color: #1a1a1a; }
  .btn:disabled { opacity: 0.5; }
  .row-2 { display: flex; gap: 10px; }
  .row-2 .btn { flex: 1; }
  .preview { width: 100%; border-radius: 10px; margin-bottom: 14px; display: none; }
  .status { padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 14px; display: none; }
  .status.ok { background: #e6f4ea; color: #137333; display: block; }
  .status.warn { background: #fef7e0; color: #b06000; display: block; }
  .status.err { background: #fce8e6; color: #c5221f; display: block; }
  .muted { color: #888; font-size: 12px; }
  .name-tag { font-weight: 700; color: #702464; }
  a.admin-link { display: block; text-align: center; margin-top: 10px; font-size: 13px; color: #888; }
  .shift-option {
    width: 100%; text-align: left; padding: 14px; border: 1.5px solid #ddd; border-radius: 10px;
    background: #fff; margin-bottom: 10px; cursor: pointer; font-size: 15px;
  }
  .shift-option:active { background: #f1e3ee; border-color: #702464; }
  .shift-option .shift-time { display:block; font-size: 13px; color: #666; margin-top: 2px; }
  .hist-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #eee; font-size:14px; }
  .hist-row:last-child { border-bottom: none; }
  .hist-left { display:flex; flex-direction:column; }
  .hist-date { font-weight:600; font-size:13px; color:#333; }
  .hist-type { font-size:12px; color:#666; }
  .hist-badge { padding:3px 9px; border-radius:10px; font-size:11px; font-weight:700; }
  .hist-badge.ok { background:#e6f4ea; color:#137333; }
  .hist-badge.bad { background:#fce8e6; color:#c5221f; }

  /* ---- Status badge waktu absen (tepat waktu/terlambat/pulang cepat/lembur) ---- */
  .stat-badge { padding:2px 8px; border-radius:8px; font-size:10px; font-weight:700; white-space:nowrap; }
  .stat-badge.ontime { background:#e3eefc; color:#1a56b0; }
  .stat-badge.late { background:#f1e3ee; color:#702464; }
  .stat-badge.early { background:#eceff1; color:#555; }
  .stat-badge.overtime { background:#e6f4ea; color:#137333; }
  .stat-badge.absent { background:#fce4ec; color:#c2185b; }

  /* ---- Profil & dashboard riwayat ---- */
  .profile-head { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .profile-avatar { width:54px; height:54px; border-radius:50%; object-fit:cover; background:#e8eaed; border:1px solid #eee; flex-shrink:0; }
  .profile-info .pname { font-weight:700; font-size:16px; }
  .profile-info .pmeta { font-size:12px; color:#666; margin-top:2px; }
  .stat-row { display:flex; gap:10px; margin-bottom:16px; }
  .stat-box { flex:1; background:#f3ead8; border-radius:12px; padding:12px 8px; text-align:center; }
  .stat-box .snum { font-size:18px; font-weight:800; color:#1a1a1a; }
  .stat-box .slbl { font-size:11px; color:#666; margin-top:2px; }
  .today-card { background:linear-gradient(135deg,#8a3380,#5c1d52); border-radius:14px; padding:14px; margin-bottom:16px; }
  .today-card .tc-label { color:#f1dcec; font-size:12px; margin-bottom:10px; }
  .today-row { display:flex; gap:10px; }
  .today-box {
    flex:1; border-radius:10px; padding:12px; border:none; text-align:left; cursor:pointer;
    font-family:inherit; -webkit-tap-highlight-color: transparent;
  }
  .today-box.in { background:rgba(255,255,255,0.18); }
  .today-box.out { background:rgba(255,255,255,0.18); }
  .today-box:active { background:rgba(255,255,255,0.3); }
  .today-box:disabled { cursor:default; opacity:0.85; }
  .today-box .tb-lbl { color:#f3e4ef; font-size:11px; font-weight:600; }
  .today-box .tb-time { color:#fff; font-size:16px; font-weight:800; margin-top:2px; }
  .day-card { border:1px solid #eee; border-radius:12px; padding:12px; margin-bottom:10px; }
  .day-card .dc-date { font-weight:700; font-size:13px; margin-bottom:8px; }
  .day-card .dc-row { display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:4px 0; }
  .day-card .dc-row .dc-lbl { color:#666; }
  .day-card .dc-row .dc-time { font-weight:700; }
  .day-card .dc-meta { font-size:11px; color:#888; margin-top:6px; }

  /* ---- Slip Gaji ---- */
  .slip-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .slip-head .sh-title { font-weight:700; font-size:16px; color:#4a1843; }
  .slip-period-nav { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .slip-period-nav button {
    border:none; background:#f3ead8; color:#702464; font-size:16px; font-weight:700;
    width:34px; height:34px; border-radius:50%; cursor:pointer; flex-shrink:0;
  }
  .slip-period-nav button:disabled { opacity:0.4; cursor:default; }
  .slip-period-label { flex:1; text-align:center; font-size:13px; font-weight:600; color:#333; }
  .slip-box { border:1.5px solid #e9ddf0; border-radius:14px; overflow:hidden; }
  .slip-id-row {
    display:flex; justify-content:space-between; gap:12px; background:#f8f3ea;
    padding:14px 16px; font-size:13px; border-bottom:1.5px solid #e9ddf0;
  }
  .slip-id-row .si-label { color:#888; font-size:11px; }
  .slip-id-row .si-value { font-weight:700; color:#2a1a26; margin-top:1px; }
  .slip-cols { display:flex; }
  .slip-col { flex:1; padding:14px 16px; }
  .slip-col + .slip-col { border-left:1.5px solid #e9ddf0; }
  .slip-col-title { font-size:12px; font-weight:800; letter-spacing:0.03em; color:#702464; margin-bottom:10px; }
  .slip-line { display:flex; justify-content:space-between; align-items:baseline; font-size:13px; padding:5px 0; gap:8px; }
  .slip-line .sl-lbl { color:#555; }
  .slip-line .sl-sub { color:#999; font-size:11px; }
  .slip-line .sl-val { font-weight:600; color:#1a1a1a; text-align:right; white-space:nowrap; }
  .slip-line.minus .sl-val { color:#c5221f; }
  .slip-total-row {
    display:flex; justify-content:space-between; font-size:13px; font-weight:800;
    padding:10px 16px; background:#f8f3ea; border-top:1.5px solid #e9ddf0;
  }
  .slip-total-row.potongan .sl-val { color:#c5221f; }
  .slip-bersih {
    display:flex; justify-content:space-between; align-items:center; padding:16px;
    background:linear-gradient(135deg,#8a3380,#5c1d52); color:#fff;
  }
  .slip-bersih .sb-lbl { font-size:12px; color:#f1dcec; font-weight:600; }
  .slip-bersih .sb-val { font-size:20px; font-weight:800; }
  .slip-note { font-size:11px; color:#999; text-align:center; margin-top:10px; }
  .slip-empty { text-align:center; color:#888; font-size:13px; padding:30px 0; }

  @media (max-width: 400px) {
    .slip-id-row { flex-wrap:wrap; gap:10px 16px; }
    .slip-cols { flex-direction:column; }
    .slip-col + .slip-col { border-left:none; border-top:1.5px solid #e9ddf0; }
    .slip-line .sl-lbl { white-space:nowrap; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand-head">
    <img src="/logo.png" alt="Erly's Cake & Bakery" class="brand-logo" />
    <div>
      <h1>Absensi Karyawan</h1>
      <div class="sub">Absen dengan foto, lokasi, dan waktu otomatis</div>
    </div>
  </div>

  <div class="card" id="phoneCard">
    <label>Nomor Telepon</label>
    <input type="tel" id="phoneInput" placeholder="Contoh: 081234567890" inputmode="numeric" />
    <button class="btn btn-primary" id="checkPhoneBtn">Lanjutkan</button>
    <div class="status" id="phoneStatus"></div>
  </div>

  <div class="card" id="actionCard" style="display:none">
    <div class="profile-head">
      <img class="profile-avatar" id="historyAvatar" src="" onerror="this.style.visibility='hidden'" />
      <div class="profile-info">
        <div class="pname" id="empName"></div>
        <div class="pmeta" id="historyEmpMeta"></div>
      </div>
    </div>

    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" />
    <img id="preview" class="preview" />

    <div class="status" id="actionStatus"></div>

    <div class="stat-row" id="statRow" style="display:none">
      <div class="stat-box"><div class="snum" id="statHadir">0</div><div class="slbl">Hari Hadir</div></div>
      <div class="stat-box"><div class="snum" id="statTerlambat">0</div><div class="slbl">Terlambat</div></div>
      <div class="stat-box"><div class="snum" id="statLembur">0</div><div class="slbl">Lembur (jam)</div></div>
    </div>

    <div class="today-card" id="todayCard">
      <div class="tc-label" id="todayDateLabel"></div>
      <div class="today-row">
        <button type="button" class="today-box in" id="btnMasuk"><div class="tb-lbl">Check In</div><div class="tb-time" id="todayMasuk">Absen Masuk</div></button>
        <button type="button" class="today-box out" id="btnKeluar"><div class="tb-lbl">Check Out</div><div class="tb-time" id="todayKeluar">Absen Keluar</div></button>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px">
      <span class="muted">Riwayat Harian</span>
      <input type="month" id="historyMonthInput" style="padding:6px 8px;border:1px solid #ddd;border-radius:8px;font-size:13px" />
    </div>
    <div id="historyList"></div>
    <div class="hint" id="historyEmpty"></div>

    <button class="btn btn-secondary" id="lihatSlipGaji" style="margin-top:4px">Slip Gaji</button>
    <button class="btn btn-secondary" id="gantiNomor">Ganti Nomor</button>
  </div>

  <div class="card" id="payslipCard" style="display:none">
    <div class="slip-head">
      <div class="sh-title">Slip Gaji</div>
      <button class="btn btn-secondary" id="tutupSlip" style="width:auto; padding:8px 14px; margin:0; font-size:13px">Tutup</button>
    </div>
    <div class="slip-period-nav">
      <button type="button" id="slipPrev" title="Periode sebelumnya">&#8249;</button>
      <div class="slip-period-label" id="slipPeriodLabel">—</div>
      <button type="button" id="slipNext" title="Periode berikutnya">&#8250;</button>
    </div>
    <div id="slipBody"></div>
  </div>

  <div class="card" id="shiftCard" style="display:none">
    <div class="sub">Lokasi terdeteksi: <span class="name-tag" id="shiftLocationName"></span></div>
    <label>Pilih Shift Anda Hari Ini</label>
    <div id="shiftOptions"></div>
    <button class="btn btn-secondary" id="batalShift">Batal</button>
  </div>

  <div class="muted" style="text-align:center">
    Pastikan izin <b>Lokasi</b> dan <b>Kamera</b> diaktifkan di browser Anda.
  </div>
  <a class="admin-link" href="/admin.html">Admin</a>
</div>

<script>
const phoneCard = document.getElementById('phoneCard');
const actionCard = document.getElementById('actionCard');
const shiftCard = document.getElementById('shiftCard');
const phoneInput = document.getElementById('phoneInput');
const phoneStatus = document.getElementById('phoneStatus');
const empName = document.getElementById('empName');
const photoInput = document.getElementById('photoInput');
const preview = document.getElementById('preview');
const actionStatus = document.getElementById('actionStatus');
const shiftLocationName = document.getElementById('shiftLocationName');
const shiftOptions = document.getElementById('shiftOptions');

let currentPhone = '';
let currentType = null;
let currentShift = null;
let currentLat = null;
let currentLng = null;

function showStatus(el, msg, cls) {
  el.textContent = msg;
  el.className = 'status ' + cls;
}

let currentProfile = null;

document.getElementById('checkPhoneBtn').addEventListener('click', async () => {
  const phone = phoneInput.value.trim();
  if (!phone) return showStatus(phoneStatus, 'Nomor telepon wajib diisi', 'err');
  showStatus(phoneStatus, 'Memeriksa...', 'warn');
  try {
    const res = await fetch('/api/check-phone', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone }),
    });
    const data = await res.json();
    if (!res.ok) return showStatus(phoneStatus, data.error || 'Nomor tidak ditemukan', 'err');
    currentPhone = phone;
    currentProfile = data;
    empName.textContent = data.name;
    document.getElementById('historyEmpMeta').textContent = [data.position, data.idNumber ? 'ID: ' + data.idNumber : ''].filter(Boolean).join(' • ');
    const avatarEl = document.getElementById('historyAvatar');
    if (data.photoUrl) { avatarEl.src = data.photoUrl; avatarEl.style.visibility = 'visible'; }
    else { avatarEl.style.visibility = 'hidden'; }

    phoneCard.style.display = 'none';
    actionCard.style.display = 'block';
    phoneStatus.style.display = 'none';

    historyMonthInput.value = new Date().toISOString().slice(0, 7);
    loadHistory();
  } catch (e) {
    showStatus(phoneStatus, 'Gagal menghubungi server: ' + e.message, 'err');
  }
});

document.getElementById('gantiNomor').addEventListener('click', () => {
  actionCard.style.display = 'none';
  phoneCard.style.display = 'block';
  preview.style.display = 'none';
  actionStatus.style.display = 'none';
});

// ---- Slip Gaji ----
const payslipCard = document.getElementById('payslipCard');
const slipBody = document.getElementById('slipBody');
const slipPeriodLabel = document.getElementById('slipPeriodLabel');
let slipFrom = null;
let slipTo = null;

function formatRupiah(n) {
  const num = Number(n) || 0;
  const sign = num < 0 ? '-' : '';
  return sign + 'Rp' + Math.abs(Math.round(num)).toLocaleString('id-ID');
}

function fmtPeriodLabel(from, to) {
  const opt = { day: 'numeric', month: 'long', year: 'numeric' };
  const a = new Date(from + 'T00:00:00').toLocaleDateString('id-ID', opt);
  const b = new Date(to + 'T00:00:00').toLocaleDateString('id-ID', opt);
  return `${a} – ${b}`;
}

// Geser periode gajian (format 26 - 25) mundur/maju satu bulan.
function shiftPayrollPeriod(to, deltaMonths) {
  const [y, m] = to.split('-').map(Number); // 'to' selalu tanggal 25
  const base = new Date(y, m - 1 + deltaMonths, 25);
  const pad = (n) => String(n).padStart(2, '0');
  const newTo = `${base.getFullYear()}-${pad(base.getMonth() + 1)}-25`;
  const prev = new Date(base.getFullYear(), base.getMonth() - 1, 26);
  const newFrom = `${prev.getFullYear()}-${pad(prev.getMonth() + 1)}-26`;
  return { from: newFrom, to: newTo };
}

async function loadPayslip() {
  slipPeriodLabel.textContent = slipFrom && slipTo ? fmtPeriodLabel(slipFrom, slipTo) : 'Memuat...';
  slipBody.innerHTML = '<div class="slip-empty">Memuat slip gaji...</div>';
  try {
    const params = new URLSearchParams({ phone: currentPhone });
    if (slipFrom) params.set('from', slipFrom);
    if (slipTo) params.set('to', slipTo);
    const res = await fetch(`/api/my-payslip?${params.toString()}`);
    const data = await res.json();
    if (!res.ok) { slipBody.innerHTML = `<div class="slip-empty">${data.error || 'Gagal memuat slip gaji'}</div>`; return; }

    slipFrom = data.from; slipTo = data.to;
    slipPeriodLabel.textContent = fmtPeriodLabel(data.from, data.to);

    const s = data.slip;
    if (!s) { slipBody.innerHTML = '<div class="slip-empty">Belum ada data gaji untuk periode ini.</div>'; return; }

    const emp = data.employee;
    slipBody.innerHTML = `
      <div class="slip-box">
        <div class="slip-id-row">
          <div><div class="si-label">No ID</div><div class="si-value">${emp.idNumber || '—'}</div></div>
          <div><div class="si-label">Nama</div><div class="si-value">${emp.name}</div></div>
          <div><div class="si-label">Jabatan</div><div class="si-value">${emp.position || '—'}</div></div>
        </div>
        <div class="slip-cols">
          <div class="slip-col">
            <div class="slip-col-title">PENDAPATAN</div>
            <div class="slip-line"><span class="sl-lbl">Gaji Pokok</span><span class="sl-val">${formatRupiah(s.gajiPokok)}</span></div>
            <div class="slip-line"><span class="sl-lbl">Uang Makan</span><span class="sl-val">${formatRupiah(s.uangMakan)}</span></div>
            <div class="slip-line"><span class="sl-lbl">Lembur Awal <span class="sl-sub">(${s.lemburAwalJam} j)</span></span><span class="sl-val">${formatRupiah(s.lemburAwalRp)}</span></div>
            <div class="slip-line"><span class="sl-lbl">Lembur Akhir <span class="sl-sub">(${s.lemburAkhirJam} j)</span></span><span class="sl-val">${formatRupiah(s.lemburAkhirRp)}</span></div>
          </div>
          <div class="slip-col">
            <div class="slip-col-title">POTONGAN</div>
            <div class="slip-line minus"><span class="sl-lbl">Tidak Masuk <span class="sl-sub">(${s.offBerlebih} hr)</span></span><span class="sl-val">${formatRupiah(s.potonganOff)}</span></div>
            <div class="slip-line minus"><span class="sl-lbl">Terlambat <span class="sl-sub">(${s.terlambatKali}x, ${s.terlambatJam} j)</span></span><span class="sl-val">${formatRupiah(s.potonganTerlambat)}</span></div>
            <div class="slip-line minus"><span class="sl-lbl">Pulang Cepat <span class="sl-sub">(${s.pulangCepatJam} j)</span></span><span class="sl-val">${formatRupiah(s.potonganPulangCepat)}</span></div>
          </div>
        </div>
        <div class="slip-total-row"><span>TOTAL PENDAPATAN</span><span class="sl-val">${formatRupiah(s.totalPendapatan)}</span></div>
        <div class="slip-total-row potongan"><span>TOTAL POTONGAN</span><span class="sl-val">${formatRupiah(s.totalPotongan)}</span></div>
        <div class="slip-total-row">
          <span>Kerajinan ${s.kerajinanEligible ? '' : '<span class="sl-sub">(tidak memenuhi syarat)</span>'}</span>
          <span class="sl-val">${formatRupiah(s.kerajinan)}</span>
        </div>
        <div class="slip-total-row"><span>Transport</span><span class="sl-val">${formatRupiah(s.uangTransport)}</span></div>
        <div class="slip-bersih">
          <span class="sb-lbl">GAJI BERSIH</span>
          <span class="sb-val">${formatRupiah(s.gajiBersih)}</span>
        </div>
      </div>
      <div class="slip-note">Hari hadir: ${s.hariHadir} • Dibuat otomatis oleh sistem absensi</div>
    `;
  } catch (e) {
    slipBody.innerHTML = `<div class="slip-empty">Gagal memuat slip gaji: ${e.message}</div>`;
  }
}

document.getElementById('lihatSlipGaji').addEventListener('click', () => {
  slipFrom = null; slipTo = null;
  actionCard.style.display = 'none';
  payslipCard.style.display = 'block';
  loadPayslip();
});
document.getElementById('tutupSlip').addEventListener('click', () => {
  payslipCard.style.display = 'none';
  actionCard.style.display = 'block';
});
document.getElementById('slipPrev').addEventListener('click', () => {
  if (!slipTo) return;
  const p = shiftPayrollPeriod(slipTo, -1);
  slipFrom = p.from; slipTo = p.to;
  loadPayslip();
});
document.getElementById('slipNext').addEventListener('click', () => {
  if (!slipTo) return;
  const p = shiftPayrollPeriod(slipTo, 1);
  slipFrom = p.from; slipTo = p.to;
  loadPayslip();
});

// ---- Riwayat & ringkasan absensi (bagian dari halaman utama) ----
const historyMonthInput = document.getElementById('historyMonthInput');
const historyList = document.getElementById('historyList');
const historyEmpty = document.getElementById('historyEmpty');

historyMonthInput.addEventListener('change', loadHistory);

function fmtTerlambat(jam, menit) {
  if (!jam && !menit) return '0';
  return (jam > 0 ? jam + 'j ' : '') + menit + 'm';
}

// ---- Status badge waktu absen (mengacu pada jam shift resmi, warna seperti Pintar HR) ----
function timeToMinutes(hhmm) {
  if (!hhmm) return null;
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}
let currentToleransiMenit = 15;

function attendanceStatusBadge(record) {
  if (!record) return '';
  const t = timeToMinutes(record.timeHHMM);
  if (record.type === 'masuk') {
    const start = timeToMinutes(record.shiftStart);
    if (start === null) return '';
    if (t > start + currentToleransiMenit) return '<span class="stat-badge late">Terlambat</span>';
    return '<span class="stat-badge ontime">Tepat Waktu</span>';
  }
  // keluar
  const end = timeToMinutes(record.shiftEnd);
  if (end === null) return '';
  if (t > end) return '<span class="stat-badge overtime">Lembur</span>';
  if (t < end) return '<span class="stat-badge early">Pulang Cepat</span>';
  return '<span class="stat-badge ontime">Tepat Waktu</span>';
}

function renderTodayButtons(today) {
  const btnM = document.getElementById('btnMasuk');
  const btnK = document.getElementById('btnKeluar');
  const lblM = document.getElementById('todayMasuk');
  const lblK = document.getElementById('todayKeluar');
  document.getElementById('todayDateLabel').textContent = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
  if (today.masuk) {
    lblM.textContent = today.masuk + ' WIB';
    btnM.disabled = true;
  } else {
    lblM.textContent = 'Absen Masuk';
    btnM.disabled = false;
  }
  if (today.keluar) {
    lblK.textContent = today.keluar + ' WIB';
    btnK.disabled = true;
  } else {
    lblK.textContent = 'Absen Keluar';
    btnK.disabled = false;
  }
}

async function loadHistory() {
  historyList.innerHTML = '';
  historyEmpty.textContent = 'Memuat...';
  document.getElementById('statRow').style.display = 'none';
  try {
    const month = historyMonthInput.value;
    const res = await fetch(`/api/my-records?phone=${encodeURIComponent(currentPhone)}&month=${month}`);
    const data = await res.json();
    if (!res.ok) { historyEmpty.textContent = data.error || 'Gagal memuat riwayat'; return; }

    // Profil
    empName.textContent = data.name;
    document.getElementById('historyEmpMeta').textContent = [data.position, data.idNumber ? 'ID: ' + data.idNumber : ''].filter(Boolean).join(' • ');
    const avatarEl = document.getElementById('historyAvatar');
    if (data.photoUrl) { avatarEl.src = data.photoUrl; avatarEl.style.visibility = 'visible'; }
    else { avatarEl.style.visibility = 'hidden'; }

    // Ringkasan bulan ini
    const statRow = document.getElementById('statRow');
    statRow.style.display = 'flex';
    document.getElementById('statHadir').textContent = data.summary.hariHadir;
    document.getElementById('statTerlambat').textContent = fmtTerlambat(data.summary.terlambatJam, data.summary.terlambatMenit);
    document.getElementById('statLembur').textContent = data.totalLemburJam;

    // Tombol Absen Masuk/Keluar sekaligus menampilkan jam absen hari ini (selalu, apa pun bulan yang sedang dilihat).
    renderTodayButtons(data.today);
    currentToleransiMenit = data.toleransiMenit ?? 15;

    if (!data.records || data.records.length === 0) {
      historyEmpty.textContent = 'Belum ada riwayat absen di bulan ini.';
      return;
    }
    historyEmpty.textContent = '';

    // Kelompokkan per tanggal supaya Check In & Check Out tampil dalam satu kartu.
    const byDate = {};
    const order = [];
    data.records.forEach((r) => {
      if (!byDate[r.dateKey]) { byDate[r.dateKey] = { masuk: null, keluar: null }; order.push(r.dateKey); }
      byDate[r.dateKey][r.type] = r;
    });

    order.forEach((dateKey) => {
      const d = byDate[dateKey];
      const ref = d.masuk || d.keluar;
      const anyInvalid = (d.masuk && !d.masuk.withinRadius) || (d.keluar && !d.keluar.withinRadius);
      const card = document.createElement('div');
      card.className = 'day-card';
      const dateLabel = new Date(dateKey + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      card.innerHTML = `
        <div class="dc-date">${dateLabel}</div>
        <div class="dc-row"><span class="dc-lbl">Check In</span><span style="display:flex;align-items:center;gap:6px"><span class="dc-time">${d.masuk ? d.masuk.timeHHMM + ' WIB' : '—'}</span>${attendanceStatusBadge(d.masuk)}</span></div>
        <div class="dc-row"><span class="dc-lbl">Check Out</span><span style="display:flex;align-items:center;gap:6px"><span class="dc-time">${d.keluar ? d.keluar.timeHHMM + ' WIB' : '—'}</span>${attendanceStatusBadge(d.keluar)}</span></div>
        <div class="dc-meta">${ref.shift ? ref.shift + ' • ' : ''}${ref.nearestLocation || ''}${anyInvalid ? ' • <span style="color:#c5221f">di luar radius</span>' : ''}</div>
      `;
      historyList.appendChild(card);
    });
  } catch (e) {
    historyEmpty.textContent = 'Gagal memuat riwayat: ' + e.message;
  }
}

function getLocation() {
  if (!navigator.geolocation) {
    return Promise.reject(new Error('Perangkat tidak mendukung GPS.'));
  }
  // Coba dulu dengan GPS akurasi tinggi (lebih presisi, tapi bisa lambat di dalam ruangan).
  const tryHighAccuracy = new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve(pos.coords),
      (err) => reject(err),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
    );
  });

  return tryHighAccuracy.catch((err) => {
    // Kalau gagal karena timeout atau sinyal GPS lemah, coba lagi dengan akurasi lebih
    // rendah (WiFi/jaringan) yang biasanya lebih cepat didapat di dalam toko/ruangan.
    if (err && err.code === 3 /* TIMEOUT */) {
      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve(pos.coords),
          (err2) => reject(new Error('Gagal mengambil lokasi: ' + err2.message + '. Pastikan izin lokasi aktif dan coba berdiri lebih dekat ke pintu/jendela.')),
          { enableHighAccuracy: false, timeout: 20000, maximumAge: 5000 }
        );
      });
    }
    throw new Error('Gagal mengambil lokasi: ' + err.message + '. Pastikan izin lokasi aktif.');
  });
}

async function startAbsen(type) {
  currentType = type;
  currentShift = null;

  if (type === 'keluar') {
    // Absen keluar tidak perlu pilih shift, langsung ambil foto.
    photoInput.value = '';
    photoInput.click();
    return;
  }

  // Absen masuk: ambil lokasi dulu untuk tahu shift apa saja yang tersedia di lokasi ini.
  showStatus(actionStatus, 'Mengambil lokasi GPS...', 'warn');
  try {
    const coords = await getLocation();
    currentLat = coords.latitude;
    currentLng = coords.longitude;
    const res = await fetch('/api/nearest-location', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat: currentLat, lng: currentLng }),
    });
    const data = await res.json();
    if (!res.ok) return showStatus(actionStatus, data.error || 'Gagal memuat lokasi', 'err');
    if (!data.shifts || data.shifts.length === 0) {
      return showStatus(actionStatus, `Lokasi terdekat (${data.name}) belum punya shift yang diatur. Hubungi admin.`, 'err');
    }
    showShiftPicker(data.name, data.shifts);
    actionStatus.style.display = 'none';
  } catch (e) {
    showStatus(actionStatus, e.message, 'err');
  }
}
document.getElementById('btnMasuk').addEventListener('click', () => startAbsen('masuk'));
document.getElementById('btnKeluar').addEventListener('click', () => startAbsen('keluar'));

function showShiftPicker(locationName, shifts) {
  shiftLocationName.textContent = locationName;
  shiftOptions.innerHTML = '';
  shifts.forEach((s) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'shift-option';
    btn.innerHTML = `${s.name}<span class="shift-time">${s.startTime} – ${s.endTime}</span>`;
    btn.addEventListener('click', () => {
      currentShift = s.name;
      shiftCard.style.display = 'none';
      actionCard.style.display = 'block';
      photoInput.value = '';
      photoInput.click();
    });
    shiftOptions.appendChild(btn);
  });
  actionCard.style.display = 'none';
  shiftCard.style.display = 'block';
}

document.getElementById('batalShift').addEventListener('click', () => {
  shiftCard.style.display = 'none';
  actionCard.style.display = 'block';
});

photoInput.addEventListener('change', async () => {
  const file = photoInput.files[0];
  if (!file) return;
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';

  try {
    // Untuk absen masuk, lokasi sudah diambil sebelumnya (saat pilih shift).
    // Untuk absen keluar, ambil lokasi sekarang.
    if (currentType === 'keluar') {
      showStatus(actionStatus, 'Mengambil lokasi GPS...', 'warn');
      const coords = await getLocation();
      currentLat = coords.latitude;
      currentLng = coords.longitude;
    }

    showStatus(actionStatus, 'Mengirim data absen...', 'warn');
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const res = await fetch('/api/checkin', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: currentPhone,
            type: currentType,
            lat: currentLat,
            lng: currentLng,
            shift: currentShift,
            photoBase64: reader.result,
            deviceTime: new Date().toISOString(),
          }),
        });
        const data = await res.json();
        if (!res.ok) return showStatus(actionStatus, data.error || 'Gagal mengirim absen', 'err');
        showStatus(actionStatus, data.message, data.withinRadius ? 'ok' : 'warn');
        loadHistory();
      } catch (e) {
        showStatus(actionStatus, 'Gagal mengirim: ' + e.message, 'err');
      }
    };
    reader.readAsDataURL(file);
  } catch (e) {
    showStatus(actionStatus, e.message, 'err');
  }
});
</script>
